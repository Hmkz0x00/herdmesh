[package]
name = "hm-net"
description = "iroh endpoint, room gossip, request/response, tickets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Workspace lints, except unsafe_code is `deny` instead of `forbid` so the
# one Windows ACL FFI module (`secure_file::sys`) can `allow` it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
blake3.workspace = true
data-encoding.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom.workspace = true
hm-proto.workspace = true
hm-store.workspace = true
iroh.workspace = true
iroh-gossip.workspace = true
postcard.workspace = true
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
ed25519-dalek.workspace = true
tempfile.workspace = true
