[package]
name = "hm-daemon"
description = "Per-machine daemon wiring store, net, brief and herdr together."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Workspace lints, except unsafe_code is `deny` instead of `forbid` so the
# one Windows FFI module (`peer_owner::sys`: pipe server's user SID) can
# `allow` it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
hm-proto.workspace = true
hm-store.workspace = true
hm-net.workspace = true
hm-brief.workspace = true
hm-herdr.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
interprocess = { version = "=2.4.8", features = ["tokio"] }
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
hm-mcp.workspace = true
serde_json.workspace = true
tempfile.workspace = true
