[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# internal
hm-proto = { path = "crates/hm-proto" }
hm-store = { path = "crates/hm-store" }
hm-net = { path = "crates/hm-net" }
hm-brief = { path = "crates/hm-brief" }
hm-mcp = { path = "crates/hm-mcp" }
hm-herdr = { path = "crates/hm-herdr" }
hm-daemon = { path = "crates/hm-daemon" }
# external
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dirs = "6"
# Match iroh-base 1.x (ed25519-dalek >=3, <4).
ed25519-dalek = "3"
getrandom = "0.4"
iroh = "=1.4.1"
iroh-gossip = "=0.102.0"
postcard = { version = "1", default-features = false, features = ["alloc"] }
proptest = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
